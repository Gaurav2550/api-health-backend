spring:
  application:
    name: api-health-platform

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/apihealth}
    username: ${DB_USERNAME:apihealth}
    password: ${DB_PASSWORD:apihealth}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 25
        order_inserts: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2000}

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

# JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_IN_PRODUCTION_AT_LEAST_64_CHARS}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

  monitoring:
    thread-pool-size: ${MONITORING_THREAD_POOL_SIZE:10}
    default-interval-seconds: ${MONITORING_DEFAULT_INTERVAL:60}
    min-interval-seconds: ${MONITORING_MIN_INTERVAL:30}
    max-interval-seconds: ${MONITORING_MAX_INTERVAL:3600}
    default-timeout-millis: ${MONITORING_DEFAULT_TIMEOUT:10000}
    max-timeout-millis: ${MONITORING_MAX_TIMEOUT:30000}
    max-response-body-bytes: ${MONITORING_MAX_RESPONSE_BODY:1048576}
    max-apis-per-user: ${MONITORING_MAX_APIS_PER_USER:50}

  metrics:
    default-window-hours: ${METRICS_DEFAULT_WINDOW_HOURS:24}
    max-window-hours: ${METRICS_MAX_WINDOW_HOURS:720}
    max-page-size: ${METRICS_MAX_PAGE_SIZE:100}

  alerts:
    consecutive-failures-threshold: ${ALERT_CONSECUTIVE_FAILURES:3}
    high-error-rate-threshold: ${ALERT_HIGH_ERROR_RATE:0.5}
    high-latency-multiplier: ${ALERT_HIGH_LATENCY_MULTIPLIER:2.0}

  cache:
    default-max-size: ${CACHE_DEFAULT_MAX_SIZE:1000}
    default-ttl-minutes: ${CACHE_DEFAULT_TTL_MINUTES:5}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

# OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    com.apihealth: INFO
    org.springframework.security: WARN
