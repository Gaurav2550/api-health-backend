services:
  postgres:
    image: postgres:16-alpine
    container_name: apihealth-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-apihealth}
      POSTGRES_USER: ${DB_USER:-apihealth}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-apihealth}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apihealth -d apihealth"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: apihealth-redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apihealth-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/apihealth
      DB_USERNAME: apihealth
      DB_PASSWORD: apihealth
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-production-secret-key-that-is-at-least-64-characters-long-for-hmac-sha512}
      SERVER_PORT: 8080
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173

  prometheus:
    image: prom/prometheus:latest
    container_name: apihealth-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api-backend

volumes:
  postgres_data:
  redis_data:
