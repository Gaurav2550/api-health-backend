spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: root
    password: root
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

app:
  jwt:
    secret: test-secret-key-for-testing-only-must-be-at-least-64-characters-long-for-hs512
    expiration-ms: 3600000

  cors:
    allowed-origins: http://localhost:3000

  monitoring:
    thread-pool-size: 2
    max-apis-per-user: 10
    min-interval-seconds: 10
    max-interval-seconds: 3600
    default-interval-seconds: 60
    default-timeout-millis: 5000
    max-timeout-millis: 10000
    max-response-body-bytes: 1048576

  metrics:
    default-window-hours: 24
    max-window-hours: 720
    max-page-size: 100

  alerts:
    consecutive-failures-threshold: 3
    high-error-rate-threshold: 0.5
    high-latency-multiplier: 2.0

  cache:
    default-max-size: 100
    default-ttl-minutes: 5

logging:
  level:
    com.apihealth: INFO
